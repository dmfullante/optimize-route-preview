<!DOCTYPE html>
<html>
<head>
    <title>ORP - Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4CAF50'
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex overflow-hidden bg-gray-100">

<div id="container" class="flex w-full h-full">

    <!-- Sidebar -->
    <div id="sidebar" class="w-80 bg-white p-4 border-r border-gray-300 overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-700">Optimized Route Preview</h2>
            <button 
                id="logoutBtn" 
                class="text-sm px-2 py-1 rounded"
                onclick="logout()"
                title="Logout"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
                </svg>
            </button>
        </div>
        <div id="segmentList" class="space-y-2"></div>
        <!-- Optimized Summary Routes Button -->
        <div class="mt-4">
            <button 
                id="optimizedSummaryBtn" 
                class="w-full text-left bg-gray-200 font-bold px-3 py-2 rounded hover:bg-gray-300"
                onclick="showOptimizedRouteFull(); setActiveButton(this);"
            >
                Optimized Summary Routes
                <br>Distance: <span id="osr-distance"></span>
                <br>Duration: <span id="osr-duration"></span>
            </button>
            <div id="optimizedSummarySegments" class="ml-4 mt-2 space-y-1"></div>
        </div>
        <div id="segmentListActualRoute" class="mt-2 space-y-2"></div>
    </div>

    <!-- Map -->
    <div id="map" class="flex-1"></div>

</div>

<script>
let map;
let routeSegments = {};
const polylines = [];
const actualRouteSegments = [];
let activeButton = null;
let authToken = '';

const urlParams = new URLSearchParams(window.location.search);
const scheduleId = urlParams.get("scheduleId");

// 🔐 Authentication Guard
authToken = localStorage.getItem("authToken");

if (!authToken) {
    window.location.href = "login.html";
}

if (!scheduleId) {
    alert("No scheduleId provided.");
    window.location.href = "login.html";
}

function logout() {
    localStorage.removeItem("authToken");
    window.location.href = "login.html";
}

const BASE_URL = ``;
const API_URL = `${BASE_URL}/api/v1/schedules/optimize/compile/${scheduleId}`;
const ACTUAL_ROUTE_API = `${BASE_URL}/api/v1/collector-location-logs/actual/route?schedule_id=${scheduleId}`;

// --- Fetch actual route using token ---
async function fetchActualRoute() {
    if (!authToken) return;

    try {
        const res = await fetch(ACTUAL_ROUTE_API, {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${authToken}`,
                "Content-Type": "application/json"
            }
        });

        if (res.status === 401) {
            localStorage.removeItem("authToken");
            window.location.href = "login.html";
            return;
        }

        if (!res.ok) throw new Error("Actual route fetch failed: " + res.status);

        const data = await res.json();
        if (!data.status || !data.data || !data.data.routes) throw new Error("Invalid API response");

        const legs = data.data.routes.legs;
        actualRouteSegments.length = 0; // clear previous

        legs.forEach((leg, index) => {
            const decodedPath = google.maps.geometry.encoding.decodePath(leg.polyline.encodedPolyline);
            const hue = (index * 360 / legs.length) % 360;
            const color = `hsl(${hue}, 80%, 50%)`;

            actualRouteSegments.push({
                schedule_detail_id: leg.schedule_detail_id,
                terminal_name: leg.terminal_name,
                terminal_id: leg.terminal_id,
                polyline: decodedPath,
                start: decodedPath[0],
                end: decodedPath[decodedPath.length - 1],
                color
            });
        });

        const segmentList = document.getElementById("segmentListActualRoute");
        if (!document.getElementById("actualRouteBtn")) {
            const totalDistanceMeters = data.data.totalDistanceMeters || 0;
            const totalDurationSecs = data.data.totalDuration || 0;
            const totalDistance = (totalDistanceMeters / 1000).toFixed(2) + " km";
            const totalDuration = formatDuration(totalDurationSecs);

            const actualBtn = document.createElement("button");
            actualBtn.id = "actualRouteBtn";
            actualBtn.innerHTML = `Show Actual Route<br>Distance: ${totalDistance},<br>Duration:  ${totalDuration}`;
            actualBtn.className = "w-full text-left bg-red-500 text-white font-bold px-3 py-2 rounded hover:bg-red-600";
            actualBtn.onclick = () => { showActualRoute(); setActiveButton(actualBtn); };
            segmentList.appendChild(actualBtn);
        }

        renderActualRouteButtons();
    } catch (err) {
        console.error(err);
        alert("No segments found for actual routes: " + err.message);
    }
}

// --- Initialize map & fetch optimized route ---
async function initMapAndData() {
    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: { lat: 14.5995, lng: 120.9842 }
    });

    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("API error");
        const data = await res.json();
        if (!data.status || !data.data) throw new Error("Invalid API response");
        routeSegments = data.data;
        renderOptimizedRoutes();
    } catch (err) {
        console.error(err);
        alert("Error fetching optimized route: " + err.message);
    }
}

// --- Render optimized route buttons & polylines ---
function renderOptimizedRoutes() {
    const segmentList = document.getElementById("segmentList");

    const viewAllBtn = document.createElement("button");
    viewAllBtn.textContent = "View All Segments";
    viewAllBtn.className = "w-full text-left bg-gray-300 font-bold px-3 py-2 rounded hover:bg-gray-400";
    viewAllBtn.onclick = () => { showAllSegments(false); setActiveButton(viewAllBtn); };
    segmentList.appendChild(viewAllBtn);

    // Full route batches
    Object.keys(routeSegments.optimized_full_route).forEach((batchNo, batchIndex) => {
        const batch = routeSegments.optimized_full_route[batchNo];
        const totalDistance = batch.distance_meters ? (batch.distance_meters / 1000).toFixed(2) + ' km' : '0 km';
        const totalDuration = batch.duration ? formatDuration(batch.duration) : '0 secs';

        const batchBtn = document.createElement("button");
        batchBtn.innerHTML = `${batchNo == 1 ? 'Initial' : 'Recalibrate'}<br>Triggered: ${batch.batch_created_at}<br>
                               Distance: ${totalDistance},<br>Duration: ${totalDuration}`;
        batchBtn.className = "w-full text-left bg-gray-200 font-bold px-3 py-2 rounded hover:bg-gray-300";
        batchBtn.onclick = () => { showBatch(parseInt(batchNo), true); setActiveButton(batchBtn); };
        segmentList.appendChild(batchBtn);

        const batchContainer = document.createElement("div");
        batchContainer.className = "ml-4 mb-2 space-y-1";
        segmentList.appendChild(batchContainer);

        batch.segments.forEach(segment => {
            const path = google.maps.geometry.encoding.decodePath(segment.polyline);
            const polyline = new google.maps.Polyline({
                path,
                geodesic: true,
                strokeColor: segment.color,
                strokeOpacity: 0.8,
                strokeWeight: 4,
                map
            });
            polylines.push({ polyline, batchNo: parseInt(batchNo) });

            new google.maps.Marker({ position: path[0], map, label: segment.from === 0 ? "Origin" : segment.from });
            new google.maps.Marker({ position: path[path.length-1], map, label: segment.to });

            const segBtn = document.createElement("button");
            segBtn.textContent = `${segment.from === 0 ? "Origin" : segment.from} → ${segment.to}`;
            segBtn.className = `w-full text-left px-3 py-1 text-sm rounded border-l-4 border-[${segment.color}] hover:bg-gray-100`;
            segBtn.onclick = () => { showSegment(polyline, false); setActiveButton(segBtn); };
            batchContainer.appendChild(segBtn);
        });

        if (batchIndex === 0) { showBatch(parseInt(batchNo), true); setActiveButton(batchBtn); }
    });

    if (routeSegments.optimized_route && routeSegments.optimized_route.segments.length > 0) {
        const totalDist = routeSegments.optimized_route.distance_meters ?
                        (routeSegments.optimized_route.distance_meters / 1000).toFixed(2) + ' km' : '0 km';
        const totalDur = routeSegments.optimized_route.duration ?
                        formatDuration(routeSegments.optimized_route.duration) : '0 secs';
        document.getElementById('osr-distance').textContent = totalDist
        document.getElementById('osr-duration').textContent =totalDur
        const summaryContainer = document.getElementById("optimizedSummarySegments");

        // Clear previous
        summaryContainer.innerHTML = "";

        routeSegments.optimized_route.segments.forEach(segment => {
            const segBtn = document.createElement("button");
            segBtn.textContent = `${segment.from === 0 ? "Origin" : segment.from} → ${segment.to}`;
            segBtn.className = `w-full text-left px-3 py-1 text-sm rounded border-l-4 border-[${segment.color}] hover:bg-gray-100`;
            segBtn.onclick = () => {
                // Clear old polylines
                polylines.forEach(obj => obj.polyline.setMap(null));

                const decodedPath = google.maps.geometry.encoding.decodePath(segment.polyline);
                const polyline = new google.maps.Polyline({
                    path: decodedPath,
                    geodesic: true,
                    strokeColor: segment.color,
                    strokeOpacity: 0.8,
                    strokeWeight: 4,
                    map
                });

                // Markers
                new google.maps.Marker({ position: decodedPath[0], map, label: segment.from === 0 ? "Origin" : segment.from });
                new google.maps.Marker({ position: decodedPath[decodedPath.length - 1], map, label: segment.to });

                polylines.push({ polyline, batchNo: null });
                setActiveButton(segBtn);
            };
            summaryContainer.appendChild(segBtn);
        });
    }
}

// --- Add buttons for each actual route leg ---
function renderActualRouteButtons() {
    const segmentList = document.getElementById("segmentListActualRoute");

    const oldContainer = document.getElementById("actualLegsContainer");
    if (oldContainer) oldContainer.remove();

    const container = document.createElement("div");
    container.id = "actualLegsContainer";
    container.className = "ml-2 mb-2 space-y-1";
    segmentList.appendChild(container);

    actualRouteSegments.forEach((seg) => {
        const btn = document.createElement("button");
        btn.textContent = seg.terminal_id || 'Origin';
        btn.className = `w-full text-left px-3 py-1 text-sm rounded border-l-4 border-[${seg.color}] hover:bg-gray-100`;
        btn.onclick = () => {
            polylines.forEach(p => p.polyline.setMap(null));
            const polyline = new google.maps.Polyline({
                path: seg.polyline,
                geodesic: true,
                strokeColor: seg.color,
                strokeOpacity: 0.8,
                strokeWeight: 4,
                map
            });
            polylines.push({ polyline, batchNo: null });
            new google.maps.Marker({ position: seg.start, map, label: "Start" });
            new google.maps.Marker({ position: seg.end, map, label: "End" });
            setActiveButton(btn);
        };
        container.appendChild(btn);
    });
}

// --- Map helpers ---
function showSegment(polyline, zoom=true) { polylines.forEach(p => p.polyline.setMap(p.polyline===polyline ? map : null)); if(zoom) fitMapToVisiblePolylines(); }
function showBatch(batchNo, zoom=true) { polylines.forEach(p => p.polyline.setMap(p.batchNo===batchNo ? map : null)); if(zoom) fitMapToVisiblePolylines(); }
function showAllSegments(zoom=true) { polylines.forEach(p => p.polyline.setMap(map)); if(zoom) fitMapToVisiblePolylines(); }
function showActualRoute() { polylines.forEach(p=>p.polyline.setMap(null)); actualRouteSegments.forEach(seg=>{ const polyline=new google.maps.Polyline({ path:seg.polyline, geodesic:true, strokeColor:seg.color, strokeOpacity:0.8, strokeWeight:4, map }); polylines.push({polyline,batchNo:null}); new google.maps.Marker({position:seg.start,map,label:seg.schedule_detail_id?String(seg.schedule_detail_id):"Start"}); new google.maps.Marker({position:seg.end,map,label:"End"}); }); fitMapToVisiblePolylines(); }
function showOptimizedRouteFull() { polylines.forEach(p=>p.polyline.setMap(null)); routeSegments.optimized_route.segments.forEach(seg=>{ const path=google.maps.geometry.encoding.decodePath(seg.polyline); const polyline=new google.maps.Polyline({ path, geodesic:true, strokeColor:seg.color, strokeOpacity:0.8, strokeWeight:4, map }); polylines.push({polyline,batchNo:null}); new google.maps.Marker({position:path[0],map,label:seg.from===0?"Origin":seg.from}); new google.maps.Marker({position:path[path.length-1],map,label:seg.to}); }); fitMapToVisiblePolylines(); }
function fitMapToVisiblePolylines() { const bounds=new google.maps.LatLngBounds(); let any=false; polylines.forEach(p=>{ if(p.polyline.getMap()!==null){ p.polyline.getPath().forEach(latlng=>bounds.extend(latlng)); any=true; } }); if(any) map.fitBounds(bounds); }
function setActiveButton(btn){ if(activeButton){ activeButton.classList.remove("bg-primary","text-white","font-bold"); } activeButton=btn; activeButton.classList.add("bg-primary","text-white","font-bold"); }
function formatDuration(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.round(s%60); if(h>0) return `${h}h ${m}m ${sec}s`; if(m>0) return `${m}m ${sec}s`; return `${sec}s`; }

// --- Start the map & data ---
function waitForGoogleMaps() {
    if(window.google && google.maps) {
        initMapAndData();
        fetchActualRoute();
    } else {
        setTimeout(waitForGoogleMaps, 200);
    }
}
waitForGoogleMaps();
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCZkJXYHmctgEV8FHRj5mns5HIXGIczDmI&libraries=geometry" async defer></script>
</body>
</html>
