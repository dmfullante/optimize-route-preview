<!DOCTYPE html>
<html>
<head>
    <title>Login - ORP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center min-h-screen">

<div class="bg-white w-full max-w-sm p-8 rounded-2xl shadow-xl">
    
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
        ORP Login
    </h2>

    <div class="space-y-4">

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">
                Email
            </label>
            <input 
                type="email" 
                id="email"
                placeholder="Enter your email"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                required
            />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">
                Password
            </label>
            <input 
                type="password" 
                id="password"
                placeholder="Enter your password"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                required
            />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">
                Schedule ID
            </label>
            <input 
                type="text" 
                id="scheduleId"
                placeholder="Enter Schedule ID"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                required
            />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">
                Google Maps Key
            </label>
            <input 
                type="text" 
                id="gmapsKey"
                placeholder="Enter Valid Key"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                required
            />
        </div>

        <button 
            onclick="login()"
            class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-200"
        >
            Login
        </button>

        <p id="errorMsg" class="text-red-500 text-sm text-center"></p>
        <p class="text-blue-500 text-sm text-center">v1.0.4</p>
    </div>
</div>

<script>
const BASE_URL = ``;
const LOGIN_API = `${BASE_URL}/api/v1/login`;

async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const scheduleId = document.getElementById("scheduleId").value;
    const gmapsKey = document.getElementById("gmapsKey").value;
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.textContent = "";

    if (!email || !password || !scheduleId) {
        errorMsg.textContent = "All fields are required.";
        return;
    }

    try {
        const res = await fetch(LOGIN_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) throw new Error("Invalid credentials");

        const data = await res.json();
        const token = data.data?.token;

        if (!token) throw new Error("No token returned");

        localStorage.setItem("authToken", token);
        localStorage.setItem("gmapsKey", gmapsKey);

        window.location.href = `index.html?scheduleId=${scheduleId}`;

    } catch (err) {
        errorMsg.textContent = err.message;
    }
}
</script>

</body>
</html>
